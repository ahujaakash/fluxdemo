apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: demo6-helm-helmrepo
  namespace: flux-system
spec:
  interval: 1m
  chart:
    spec:
      chart: nginx
      version: 21.1.4
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: demo6-source-helm
        namespace: flux-system
  values:
    service:
      type: LoadBalancer
      ports:
        http: 80
        https: 443
